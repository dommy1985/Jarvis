help.full: |-
  🧠 <b>Jarvis commands</b>

  <b>Briefing</b>
  <code>briefing</code> resends today's updated briefing
  <code>ok</code> confirms · <code>2 haiku</code> changes the executor · <code>2 me</code> you do it
  <code>3 skip</code> · <code>skip all</code> · <code>hours 4</code> regenerates with 4 hours
  <code>projects</code> lists the projects we work on
  <code>briefing on other-app</code> · <code>hours 3 on my-app and other-app</code> regenerates focused on those projects, just this once (<code>briefing on all</code> puts them all back)
  <code>PROJ-412 agy</code> or <code>&lt;link&gt; sonnet</code> adds an imported ticket

  <b>Execution</b> (runner on your machine, draft PRs)
  <code>go 1</code> · <code>go 1 3</code> · <code>go all</code> queues the approved items
  <code>go 4 agy</code> changes the executor and queues
  <code>go 4 base:redesign</code> starts from that branch and the PR targets it (default: the project's <code>base_branch</code>)
  <code>go 4 note: exclude X</code> passes instructions or clarifications to the agent
  <code>go my-app#933 sonnet</code> adds a ticket to the briefing and queues it
  <code>queue</code> run status · <code>clear queue</code> removes the ones not started yet
  <code>go 4 plan</code> (also <code>go 4 plan agy</code>) plan first, then you decide: <code>approve 12</code> · <code>revise 12 &lt;text&gt;</code> · <code>discard 12</code>
  <code>log</code> (or <code>log 7</code>) latest agent actions · <code>follow</code> keeps updating them, <code>unfollow</code> to stop
  <code>stop 7</code> (or <code>stop</code>) interrupts a run · <code>stats</code> outcomes per executor
  <code>repair 7</code> (or <code>repair 7 agy</code>) resumes the PRs of run 7: tests, fixes, new review
  If the work touches my-lib you get two PRs: the framework and the app with the updated submodule

  Executors: {executors}
help.github: |-
  <b>GitHub</b> (preview, then <code>yes</code> or <code>no</code>)
  <i>open issue on other-app: new logo, in Todo</i>
