help.full: |-
  🧠 <b>Comandi Jarvis</b>

  <b>Briefing</b>
  <code>briefing</code> rimanda il briefing di oggi aggiornato
  <code>ok</code> conferma · <code>2 haiku</code> cambia esecutore · <code>2 io</code> la fai tu
  <code>3 salta</code> · <code>salta tutto</code> · <code>ore 4</code> rigenera con 4 ore
  <code>progetti</code> elenca i progetti su cui operiamo
  <code>briefing su other-app</code> · <code>ore 3 su my-app e other-app</code> rigenera concentrato su quei progetti, una volta tanto (<code>briefing su tutti</code> li rimette tutti)
  <code>PROJ-412 agy</code> o <code>&lt;link&gt; sonnet</code> aggiunge un ticket importato

  <b>Esecuzione</b> (runner sul Mac, PR draft)
  <code>vai 1</code> · <code>vai 1 3</code> · <code>vai tutti</code> mette in coda le voci approvate
  <code>vai 4 agy</code> cambia esecutore e mette in coda
  <code>vai 4 base:redesign</code> parte da quel branch e la PR punta lì (default: <code>base_branch</code> del progetto)
  <code>vai 4 nota: escludi X</code> passa istruzioni o chiarimenti all'agente
  <code>vai my-app#933 sonnet</code> aggiunge un ticket al briefing e lo mette in coda
  <code>coda</code> stato dei run · <code>svuota coda</code> toglie quelli non ancora partiti
  <code>vai 4 piano</code> (anche <code>vai 4 piano agy</code>) prima il piano, poi decidi: <code>approva 12</code> · <code>modifica 12 &lt;testo&gt;</code> · <code>scarta 12</code>
  <code>log</code> (o <code>log 7</code>) ultime azioni dell'agente · <code>segui</code> le aggiorna da sole, <code>basta</code> per smettere
  <code>ferma 7</code> (o <code>ferma</code>) interrompe un run · <code>statistiche</code> esiti per esecutore
  <code>ripara 7</code> (o <code>ripara 7 agy</code>) riprende le PR del run 7: test, correzione, nuova review
  Se il lavoro tocca my-lib arrivano due PR: framework e app con il submodule aggiornato

  Esecutori: {executors}
help.github: |-
  <b>GitHub</b> (anteprima, poi <code>sì</code> o <code>no</code>)
  <i>apri issue su other-app: logo nuovo, in Todo</i>
  <i>sposta my-app#933 in In Progress sulla board Sprint 12</i>
  <i>assegna la 940 di my-app a {owner}</i>
  <i>clona PROJ-412 su GitHub</i>
