name: Release image
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # gh release create
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: jarvis/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ || /^\[[^]]+\]: http/ {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "No CHANGELOG section for $v" > notes.md; fi
          printf '\nDocker image: `ghcr.io/%s:%s` (linux/amd64 + linux/arm64).\n' "${GITHUB_REPOSITORY,,}" "$v" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
